name: Mutation testing

# Mutation testing changes the code on purpose and checks that a test fails each time.
# It is slow, so it runs nightly and on demand, not on every pull request.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run mutation
