name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The merge ruleset requires each job by its name. Rename a job only together with the ruleset.
#
# A pull request that changes only docs skips the code-only work (#103). The steps skip, not the jobs.
# A job with skipped steps reports success under its full name. A path filter on the workflow leaves the
# required checks unreported. A skipped matrix job reports under its bare name, such as `checks`, so
# `checks (windows-latest)` never reports.
# The jobs run with `!cancelled()`, because a failed `changes` job would skip them. A skipped job can pass
# a required check with nothing run. The output of a failed `changes` job is empty, and that runs the work.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: diff
        run: bun run scripts/ci-changes.ts

  checks:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A full run takes about 14 to 20 minutes. A Bun test worker can hang with no error, and the
    # 30-second test timeout does not stop it (#574). Without this limit, the job waits 6 hours.
    timeout-minutes: 35
    env:
      # Ubuntu always runs in full: the format and public-content checks read the docs too.
      RUN_CODE_CHECKS: ${{ matrix.os == 'ubuntu-latest' || needs.changes.outputs.code_changed != 'false' }}
    steps:
      - if: env.RUN_CODE_CHECKS == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: env.RUN_CODE_CHECKS == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - if: env.RUN_CODE_CHECKS == 'true'
        run: bun install --frozen-lockfile
      # One umbrella script: format, lint, types, architecture, dead code, public content, and the
      # tests with coverage. Lefthook runs all but the tests (`check:static`) before each push.
      - if: runner.os == 'Linux'
        run: bun run check
      # The static checks and the coverage give the same result on every system, so Windows runs
      # only the tests: those are what can behave differently there (lessons 76 to 83).
      - if: runner.os == 'Windows' && env.RUN_CODE_CHECKS == 'true'
        run: bun run test

  web-ui:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Each slow step has its own limit. The browser install takes about 10 minutes on some runners, and
    # it must not use up the time of the tests. This limit only stops a runner that hangs for 6 hours.
    timeout-minutes: 50
    env:
      RUN_CODE_CHECKS: ${{ needs.changes.outputs.code_changed != 'false' }}
    steps:
      - if: env.RUN_CODE_CHECKS == 'true'
        uses: actions/checkout@v4
      - if: env.RUN_CODE_CHECKS == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - if: env.RUN_CODE_CHECKS == 'true'
        run: bun install --frozen-lockfile
      # The browser build depends on the Playwright version that bun.lock installs.
      - id: playwright-version
        if: env.RUN_CODE_CHECKS == 'true'
        run: echo "version=$(bun -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - if: env.RUN_CODE_CHECKS == 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium
      # The cache holds the browser but not the system libraries, so a cache hit installs only those.
      - name: Install the browser
        if: env.RUN_CODE_CHECKS == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: bunx playwright install --with-deps chromium
      - name: Install the browser libraries
        if: env.RUN_CODE_CHECKS == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 20
        run: bunx playwright install-deps chromium
      # The widget template runs its own check, against the contract of this commit (#688). So a change
      # that breaks a new widget fails here first. `--ignore-scripts`: its `prepare` would install its git
      # hooks in place of Eva's.
      # The Node.js of the template's own CI, whose test runner reads a glob.
      - if: env.RUN_CODE_CHECKS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.RUN_CODE_CHECKS == 'true'
        working-directory: templates/widget
        run: npm ci --ignore-scripts
      - if: env.RUN_CODE_CHECKS == 'true'
        working-directory: templates/widget
        timeout-minutes: 10
        env:
          EVA_CONTRACT_DIR: ${{ github.workspace }}/docs/widgets
        run: npm run check
      - if: env.RUN_CODE_CHECKS == 'true'
        uses: astral-sh/setup-uv@v6
      # The pskill files of the template are written by hand. The runner checks them and their skill files.
      - if: env.RUN_CODE_CHECKS == 'true'
        working-directory: templates/widget
        timeout-minutes: 5
        run: uv run .pskill/pskill.py validate
      # Browser tests of the web UI, at desktop size and at 375 px. They take about 14 minutes.
      # A stuck page must not hold the runner.
      - if: env.RUN_CODE_CHECKS == 'true'
        timeout-minutes: 25
        run: bun run test:e2e
      # A failure that only CI shows needs the browser trace of the failed test to be understood.
      - if: failure() && env.RUN_CODE_CHECKS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  # The single executable, started the way a new person starts it.
  package:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN_CODE_CHECKS: ${{ needs.changes.outputs.code_changed != 'false' }}
    steps:
      - if: env.RUN_CODE_CHECKS == 'true'
        uses: actions/checkout@v4
      - if: env.RUN_CODE_CHECKS == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - if: env.RUN_CODE_CHECKS == 'true'
        run: bun install --frozen-lockfile
      - if: env.RUN_CODE_CHECKS == 'true'
        run: bun run build:executable
      - name: Smoke test the executable
        if: env.RUN_CODE_CHECKS == 'true'
        shell: bash
        run: bash scripts/smoke-executable.sh "dist/eva${{ runner.os == 'Windows' && '.exe' || '' }}"
      # The one-command install (install/), as a new person runs it. Linux uses a clean Ubuntu with no git.
      - name: Smoke test the install script
        if: env.RUN_CODE_CHECKS == 'true' && runner.os == 'Linux'
        run: bash scripts/smoke-install.sh dist/eva
      - name: Smoke test the install script
        if: env.RUN_CODE_CHECKS == 'true' && runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-install.ps1 dist/eva.exe

  voice:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The install of ffmpeg and espeak-ng once took 31 minutes on a slow package mirror. The release
    # waits for this job, so a hung step must fail fast, not after 6 hours. The job limit leaves room
    # for a cache miss, which builds whisper.cpp.
    timeout-minutes: 45
    env:
      WHISPER_VERSION: v1.7.6
      RUN_CODE_CHECKS: ${{ needs.changes.outputs.code_changed != 'false' }}
    steps:
      - if: env.RUN_CODE_CHECKS == 'true'
        uses: actions/checkout@v4
      - if: env.RUN_CODE_CHECKS == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - if: env.RUN_CODE_CHECKS == 'true'
        run: bun install --frozen-lockfile
      - if: env.RUN_CODE_CHECKS == 'true'
        timeout-minutes: 20
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - if: env.RUN_CODE_CHECKS == 'true'
        uses: actions/cache@v4
        id: whisper-cache
        with:
          path: ${{ runner.temp }}/whisper.cpp
          key: whisper-${{ env.WHISPER_VERSION }}-base.en
      # A skipped cache step has an empty `cache-hit`, so this step tests the docs-only case too.
      - name: Build whisper.cpp and download a model
        if: env.RUN_CODE_CHECKS == 'true' && steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$WHISPER_VERSION" https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/whisper.cpp"
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper.cpp"/build -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/whisper.cpp"/build --config Release --target whisper-cli -j 4
          bash "$RUNNER_TEMP/whisper.cpp"/models/download-ggml-model.sh base.en
      # A recorded voice note, as Telegram sends it: Opus audio in an Ogg file.
      - name: Record a voice note
        if: env.RUN_CODE_CHECKS == 'true'
        run: |
          espeak-ng -w "$RUNNER_TEMP/note.wav" "Please buy milk and bread tomorrow morning."
          ffmpeg -loglevel error -i "$RUNNER_TEMP/note.wav" -c:a libopus "$RUNNER_TEMP/note.ogg"
      - if: env.RUN_CODE_CHECKS == 'true'
        run: bun test test/unit/core/voice/transcriber-live.test.ts
        env:
          EVA_VOICE_WHISPER: ${{ runner.temp }}/whisper.cpp/build/bin/whisper-cli
          EVA_VOICE_MODEL: ${{ runner.temp }}/whisper.cpp/models/ggml-base.en.bin
          EVA_VOICE_SAMPLE: ${{ runner.temp }}/note.ogg
          EVA_VOICE_EXPECTED: milk

  # Always in full: it scans every changed file, docs included.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
