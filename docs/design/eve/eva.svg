<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -22 160 160" width="160" height="160">
  <!-- EVE's visor with the shell ring. The eyes search and blink, as the e-scan face of visor.css. -->
  <style>
    .look { animation: look 6s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 6s infinite; }
    @keyframes look {
      0%, 4% { transform: translate(0, 0); }
      14%, 24% { transform: translate(-10px, 1px); }
      34%, 42% { transform: translate(10px, -4px); }
      52%, 58% { transform: translate(-4px, -6px); }
      66%, 90% { transform: translate(5px, 2px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes blink {
      0%, 45%, 49%, 93%, 97%, 100% { transform: scaleY(1); }
      47%, 95% { transform: scaleY(0.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .look, .eye { animation: none; }
    }
  </style>
  <defs>
    <radialGradient id="visor" cx="50%" cy="22%" r="72%" fx="50%" fy="22%">
      <stop offset="0" stop-color="#1c252d" />
      <stop offset="1" stop-color="#000102" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-80%" width="200%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#87ddff" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3ab3ff" />
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#0f304a" flood-opacity="0.35" />
    </filter>
  </defs>
  <path d="M50 -10A60 59.5 0 0 1 110 49.5A56 50.5 0 0 1 54 100H46A56 50.5 0 0 1 -10 49.5A60 59.5 0 0 1 50 -10z" fill="#ffffff" filter="url(#shadow)" />
  <path d="M50 0A50 49.5 0 0 1 100 49.5A46 40.5 0 0 1 54 90H46A46 40.5 0 0 1 0 49.5A50 49.5 0 0 1 50 0z" fill="url(#visor)" />
  <g class="look">
    <g fill="#87ddff" filter="url(#glow)">
      <g transform="rotate(14 29 45)"><ellipse class="eye" cx="29" cy="45" rx="13" ry="8" /></g>
      <g transform="rotate(-14 71 45)"><ellipse class="eye" cx="71" cy="45" rx="13" ry="8" /></g>
    </g>
  </g>
</svg>
