<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Eva EVE design reference</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Quicksand:wght@400;500;600;700&display=swap"
    />
    <style>
      /* Layout: one long scroll. Each Eva page is a row: the computer view on the left, the phone on the right.
   Every colour comes from one seed (--h hue, --c chroma, --l lightness) that the colour bar sets. */
      :root {
        --h: 237;
        --c: 0.165;
        --l: 0.7;
        --on-l: 0.2;
        --s-bg: oklch(0.975 0.006 var(--h));
        --s-surface: oklch(1 0 0);
        --s-ink: oklch(0.23 0.02 var(--h));
        --s-muted: oklch(0.5 0.02 var(--h));
        --s-line: oklch(0.9 0.012 var(--h));
        --s-accent: oklch(min(var(--l), 0.52) var(--c) var(--h));
        --s-soft: oklch(0.95 calc(var(--c) * 0.25) var(--h));
        --font: "Quicksand", "Nunito", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --s-bg: oklch(0.14 0.015 var(--h));
          --s-surface: oklch(0.19 0.02 var(--h));
          --s-ink: oklch(0.94 0.01 var(--h));
          --s-muted: oklch(0.7 0.025 var(--h));
          --s-line: oklch(0.28 0.02 var(--h));
          --s-accent: oklch(max(var(--l), 0.8) var(--c) var(--h));
          --s-soft: oklch(0.27 calc(var(--c) * 0.4) var(--h));
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --s-bg: oklch(0.14 0.015 var(--h));
        --s-surface: oklch(0.19 0.02 var(--h));
        --s-ink: oklch(0.94 0.01 var(--h));
        --s-muted: oklch(0.7 0.025 var(--h));
        --s-line: oklch(0.28 0.02 var(--h));
        --s-accent: oklch(max(var(--l), 0.8) var(--c) var(--h));
        --s-soft: oklch(0.27 calc(var(--c) * 0.4) var(--h));
        color-scheme: dark;
      }
      body {
        background: var(--s-bg);
        color: var(--s-ink);
        font: 500 15px/1.55 var(--font);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--s-bg);
      }
      .wrap {
        max-width: 1500px;
        margin: 0 auto;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 28px 64px;
      }

      .hero {
        display: flex;
        flex-wrap: wrap;
        gap: 20px 32px;
        align-items: center;
        padding-block: 8px 20px;
      }
      .hero h1 {
        font: 700 clamp(30px, 4.4vw, 46px)/1.05 var(--font);
        margin: 0;
        letter-spacing: -0.015em;
        text-wrap: balance;
      }
      .hero p {
        margin: 8px 0 0;
        color: var(--s-muted);
        max-width: 64ch;
      }
      .hero .t {
        flex: 1 1 420px;
        min-width: 0;
      }

      .toolbar {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: color-mix(in oklch, var(--s-bg) 88%, transparent);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--s-line);
        margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 10px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 18px;
      }
      .tb-l {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--s-muted);
      }
      .swatches {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 4px 2px;
        min-width: 0;
        max-width: 100%;
        scrollbar-width: thin;
      }
      .sw {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 0;
        padding: 0;
        cursor: pointer;
        flex: none;
        position: relative;
        box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.1);
      }
      .sw[aria-pressed="true"] {
        box-shadow:
          0 0 0 2px var(--s-bg),
          0 0 0 4px var(--s-ink);
      }
      .sw:focus-visible,
      .seg button:focus-visible,
      .jump a:focus-visible {
        outline: 2px solid var(--s-accent);
        outline-offset: 3px;
      }
      .custom {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--s-muted);
        cursor: pointer;
        flex: none;
      }
      .custom input {
        width: 30px;
        height: 30px;
        border: 0;
        padding: 0;
        background: none;
        cursor: pointer;
        border-radius: 50%;
      }
      .cname {
        font-weight: 700;
        font-size: 14px;
        min-width: 7ch;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--s-line);
        border-radius: 999px;
        background: var(--s-surface);
        padding: 3px;
        gap: 2px;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--s-muted);
        font: 600 13px var(--font);
        padding: 5px 14px;
        border-radius: 999px;
        cursor: pointer;
      }
      .seg button[aria-pressed="true"] {
        background: var(--s-soft);
        color: var(--s-ink);
      }
      .tb-sp {
        flex: 1;
      }

      .jump {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding-block: 18px 6px;
      }
      .jump a {
        text-decoration: none;
        color: var(--s-ink);
        font-size: 13px;
        font-weight: 600;
        padding: 5px 12px;
        border-radius: 999px;
        border: 1px solid var(--s-line);
        background: var(--s-surface);
      }
      .jump a:hover {
        border-color: var(--s-accent);
        color: var(--s-accent);
      }

      .sec {
        padding-block: 44px 8px;
        border-top: 1px solid var(--s-line);
        margin-top: 36px;
        scroll-margin-top: 70px;
      }
      .sec:first-of-type {
        border-top: 0;
        margin-top: 8px;
      }
      .sh {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px 40px;
        margin-bottom: 22px;
      }
      .kicker {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--s-accent);
      }
      .sh h2 {
        font: 700 28px/1.15 var(--font);
        margin: 4px 0 6px;
        text-wrap: balance;
      }
      .sh p {
        margin: 0;
        color: var(--s-muted);
        max-width: 60ch;
      }
      .imp {
        margin: 0;
        padding: 14px 18px 14px 18px;
        list-style: none;
        background: var(--s-surface);
        border: 1px solid var(--s-line);
        border-radius: 18px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
      }
      .imp b {
        display: block;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--s-muted);
        margin-bottom: 2px;
      }
      .imp li {
        padding-left: 18px;
        position: relative;
      }
      .imp li::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 0.62em;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--s-accent);
      }
      .pair {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 330px);
        gap: 32px;
        align-items: start;
      }
      .cap {
        font-size: 12px;
        font-weight: 700;
        color: var(--s-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }
      @media (max-width: 960px) {
        .sh {
          grid-template-columns: minmax(0, 1fr);
        }
        .pair {
          grid-template-columns: minmax(0, 1fr);
        }
        .pair > div:last-child {
          max-width: 340px;
          width: 100%;
          margin: 0 auto;
        }
      }
      .fit {
        position: relative;
        width: 100%;
        overflow: hidden;
      }
      .fit > .inner {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
      }
      .desk-frame {
        width: 1280px;
        height: 844px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--s-line);
        background: var(--s-surface);
        box-shadow: 0 30px 70px -36px oklch(0.3 0.05 var(--h) / 0.5);
      }
      .winbar {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        color: var(--s-muted);
        font: 500 13px var(--font);
        background: var(--s-surface);
        border-bottom: 1px solid var(--s-line);
      }
      .winbar i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--s-line);
      }
      .winbar .url {
        margin: 0 auto;
        background: var(--s-bg);
        border-radius: 999px;
        padding: 4px 90px;
        font-size: 12.5px;
      }
      .phone-frame {
        width: 414px;
        height: 848px;
        border-radius: 62px;
        background: oklch(0.12 0.01 var(--h));
        padding: 12px;
        position: relative;
        box-shadow:
          0 30px 60px -28px oklch(0.2 0.04 var(--h) / 0.55),
          inset 0 0 0 2px oklch(0.3 0.01 var(--h));
      }
      .phone-frame .screen {
        width: 390px;
        height: 824px;
        border-radius: 50px;
        overflow: hidden;
        position: relative;
      }
      .phone-frame .island {
        position: absolute;
        top: 23px;
        left: 50%;
        transform: translateX(-50%);
        width: 112px;
        height: 32px;
        border-radius: 20px;
        background: #000;
        z-index: 30;
      }

      /* ---------- The EVE interface. Tokens first, all from the seed. ---------- */
      .eve {
        --bg: oklch(0.972 0.008 var(--h));
        --bg2: oklch(0.925 0.018 var(--h));
        --side: oklch(0.986 0.005 var(--h));
        --panel: oklch(1 0 0);
        --ink: oklch(0.25 0.025 var(--h));
        --muted: oklch(0.55 0.025 var(--h));
        --line: oklch(0.915 0.012 var(--h));
        --chip: oklch(0.95 0.012 var(--h));
        --accent: oklch(var(--l) var(--c) var(--h));
        --accent-ink: oklch(min(var(--l), 0.52) calc(var(--c) * 0.9) var(--h));
        --on-accent: oklch(var(--on-l) 0.03 var(--h));
        --soft: oklch(0.945 calc(var(--c) * 0.25) var(--h));
        --soft-ink: oklch(0.4 calc(var(--c) * 0.6) var(--h));
        --eye: oklch(0.87 min(var(--c), 0.13) var(--h));
        --glow: oklch(0.74 var(--c) var(--h));
        --visor: oklch(0.26 0.02 var(--h));
        --visor2: oklch(0.07 0.01 var(--h));
        --shell: oklch(1 0 0);
        --shadow: 0 10px 30px oklch(0.4 0.05 var(--h) / 0.11), 0 1px 2px oklch(0.4 0.05 var(--h) / 0.06);
        --ok: oklch(0.56 0.14 150);
        --ok-bg: oklch(0.95 0.04 150);
        --warn: oklch(0.6 0.14 65);
        --warn-bg: oklch(0.96 0.05 85);
        --bad: oklch(0.56 0.19 25);
        --bad-bg: oklch(0.95 0.03 25);
        --scrim: oklch(0.25 0.03 var(--h) / 0.32);
        font: 500 14px/1.5 var(--font);
        color: var(--ink);
        background: var(--bg);
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
      }
      .eve[data-mode="dark"] {
        --bg: oklch(0.16 0.02 var(--h));
        --bg2: oklch(0.23 0.045 var(--h));
        --side: oklch(0.18 0.02 var(--h));
        --panel: oklch(0.22 0.022 var(--h));
        --ink: oklch(0.94 0.012 var(--h));
        --muted: oklch(0.7 0.03 var(--h));
        --line: oklch(0.29 0.025 var(--h));
        --chip: oklch(0.26 0.025 var(--h));
        --accent: oklch(max(var(--l), 0.74) var(--c) var(--h));
        --accent-ink: oklch(max(var(--l), 0.82) var(--c) var(--h));
        --on-accent: oklch(0.17 0.03 var(--h));
        --soft: oklch(0.3 calc(var(--c) * 0.45) var(--h));
        --soft-ink: oklch(0.92 calc(var(--c) * 0.4) var(--h));
        --shell: oklch(0.32 0.02 var(--h));
        --shadow: 0 0 0 1px oklch(0.29 0.025 var(--h)), 0 12px 30px oklch(0 0 0 / 0.4);
        --ok: oklch(0.8 0.15 150);
        --ok-bg: oklch(0.3 0.06 150);
        --warn: oklch(0.84 0.13 80);
        --warn-bg: oklch(0.32 0.06 75);
        --bad: oklch(0.74 0.16 25);
        --bad-bg: oklch(0.32 0.07 25);
        --scrim: oklch(0.05 0.01 var(--h) / 0.55);
      }
      .eve * {
        box-sizing: border-box;
      }
      .eve svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .eve code,
      .eve .mono {
        font-family: var(--mono);
        font-size: 0.88em;
      }
      .eve code {
        background: var(--chip);
        padding: 1px 6px;
        border-radius: 6px;
      }
      .eve h1,
      .eve h2,
      .eve h3,
      .eve p {
        margin: 0;
      }

      /* The visor: EVE's black face with two glowing eyes. Sized in em, so one font-size scales it. */
      .mk {
        font-size: 36px;
        width: 1em;
        height: 0.9em;
        border-radius: 50% 50% 46% 46% / 55% 55% 45% 45%;
        background: radial-gradient(ellipse at 50% 22%, var(--visor), var(--visor2) 72%);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.16em;
        flex: none;
        position: relative;
      }
      /* Only the eyes move. The wrapper carries the glow, so every eye shape glows the same way.
   Some expressions add a small idle motion; the transitions morph one face into the next. */
      .mk .eyes {
        display: flex;
        align-items: center;
        gap: 0.16em;
        filter: drop-shadow(0 0 0.05em var(--eye)) drop-shadow(0 0 0.14em var(--glow));
      }
      .mk i {
        display: block;
        position: relative;
        width: 0.26em;
        height: 0.16em;
        border-radius: 50%;
        background-color: var(--eye);
        animation: blink 7s infinite;
        transition:
          width 0.35s,
          height 0.35s,
          border-radius 0.35s,
          rotate 0.35s,
          translate 0.35s,
          background-color 0.35s,
          opacity 0.35s;
      }
      .mk i:first-child {
        rotate: var(--r1, 14deg);
      }
      .mk i:last-child {
        rotate: var(--r2, -14deg);
        animation-delay: 0.05s;
      }
      .mk i::before,
      .mk i::after {
        content: "";
        position: absolute;
        top: 0;
        width: 0.13em;
        height: 0.208em;
        border-radius: 0.07em 0.07em 0 0;
        background: var(--eye);
        opacity: 0;
        transition:
          opacity 0.3s,
          rotate 0.3s,
          width 0.3s,
          height 0.3s,
          top 0.3s,
          left 0.3s;
      }
      .mk i::before {
        left: 0.13em;
        rotate: -45deg;
        transform-origin: 0 100%;
      }
      .mk i::after {
        left: 0;
        rotate: 45deg;
        transform-origin: 100% 100%;
      }
      .mk::after {
        content: "z";
        position: absolute;
        top: -0.12em;
        right: -0.06em;
        font: 700 0.26em var(--font);
        color: var(--eye);
        opacity: 0;
        transition: opacity 0.35s;
        text-shadow: 0 0 0.3em var(--glow);
      }
      .mk.s {
        font-size: 28px;
      }
      .mk.xl {
        font-size: 128px;
        box-shadow:
          0 0 0 0.1em var(--shell),
          0 0.3em 0.5em -0.1em oklch(0.3 0.06 var(--h) / 0.35);
      }
      .mk.l {
        font-size: 76px;
        box-shadow:
          0 0 0 0.1em var(--shell),
          0 0.25em 0.5em -0.1em oklch(0.3 0.06 var(--h) / 0.3);
      }
      .mk.e-neutral .eyes {
        animation: glance 9s ease-in-out infinite;
      }
      /* Happy eyes are the same filled oval with the lower part masked away: a crescent with pointed tips, as in the film. */
      .mk.e-joy {
        --r1: 0deg;
        --r2: 0deg;
      }
      .mk.e-joy i {
        height: 0.24em;
        width: 0.27em;
        -webkit-mask: radial-gradient(ellipse 60% 62% at 50% 110%, transparent 98%, #000 100%);
        mask: radial-gradient(ellipse 60% 62% at 50% 110%, transparent 98%, #000 100%);
        animation: none;
      }
      .mk.e-joy .eyes {
        animation: bounce 1.6s ease-in-out infinite;
      }
      @keyframes wink {
        0%,
        52%,
        100% {
          transform: scaleY(1);
        }
        60%,
        82% {
          transform: scaleY(0.08);
        }
        90% {
          transform: scaleY(1.06);
        }
      }
      @keyframes wsquint {
        0%,
        52%,
        100% {
          transform: scaleY(1);
        }
        60%,
        82% {
          transform: scaleY(0.72);
        }
      }
      .gal.vgal {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      @media (max-width: 900px) {
        .gal.vgal {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      .vgal .letter {
        font: 700 13px var(--font);
        color: var(--accent-ink);
        background: var(--soft);
        border-radius: 99px;
        padding: 2px 10px;
      }
      .mk.e-wink {
        --r2: 0deg;
      }
      .mk.e-wink i:last-child {
        animation: wink 2.6s ease-in-out infinite;
      }
      .mk.e-wink i:first-child {
        animation: wsquint 2.6s ease-in-out infinite;
      }

      .mk.e-surprise {
        --r1: 0deg;
        --r2: 0deg;
      }
      .mk.e-surprise i {
        width: 0.23em;
        height: 0.23em;
        animation:
          blink 7s infinite,
          pop 3s ease-in-out infinite;
      }
      .mk.e-think {
        --r1: 0deg;
        --r2: 0deg;
      }
      .mk.e-think i {
        height: 0.14em;
        width: 0.22em;
        animation:
          blink 7s infinite,
          think 4s ease-in-out infinite;
      }
      .mk.e-think i:last-child {
        width: 0.19em;
        height: 0.12em;
      }
      .mk.e-scan .eyes {
        animation: look 5s ease-in-out infinite;
      }
      .mk.e-listen {
        --r1: 0deg;
        --r2: 0deg;
      }
      .mk.e-listen i {
        width: 0.2em;
        height: 0.2em;
        animation:
          blink 7s infinite,
          listen 1.4s ease-in-out infinite;
      }
      .mk.e-focus {
        --r1: 6deg;
        --r2: -6deg;
      }
      .mk.e-focus i {
        height: 0.07em;
        width: 0.29em;
        border-radius: 0.05em;
      }
      .mk.e-worry {
        --r1: -14deg;
        --r2: 14deg;
      }
      .mk.e-worry i {
        height: 0.14em;
        border-radius: 50% 50% 45% 45% / 35% 35% 65% 65%;
      }
      .mk.e-worry .eyes {
        animation: tremble 0.5s ease-in-out infinite;
      }
      .mk.e-sad {
        --r1: -18deg;
        --r2: 18deg;
      }
      .mk.e-sad i {
        height: 0.12em;
        border-radius: 0.02em 0.02em 0.14em 0.14em;
        translate: 0 0.03em;
      }
      .mk.e-firm {
        --r1: 20deg;
        --r2: -20deg;
      }
      .mk.e-firm i {
        height: 0.13em;
        border-radius: 0.02em 0.02em 0.14em 0.14em;
      }

      .mk.e-skeptic {
        --r1: 0deg;
        --r2: -8deg;
      }
      .mk.e-skeptic i:first-child {
        height: 0.06em;
        border-radius: 0.04em;
        translate: 0 0.02em;
        animation: none;
      }
      .mk.e-skeptic i:last-child {
        height: 0.17em;
        translate: 0 -0.02em;
      }
      .mk.e-love {
        --r1: 0deg;
        --r2: 0deg;
      }
      .mk.e-love i {
        background-color: transparent;
        width: 0.26em;
        height: 0.23em;
        border-radius: 0;
        translate: 0 0.03em;
        animation: beat 1.1s ease-in-out infinite;
      }
      .mk.e-love i::before,
      .mk.e-love i::after {
        opacity: 1;
      }
      .mk.e-sleep {
        --r1: 0deg;
        --r2: 0deg;
      }
      .mk.e-sleep i {
        height: 0.03em;
        width: 0.24em;
        border-radius: 0.02em;
        translate: 0 0.04em;
        animation: breathe 4s ease-in-out infinite;
      }
      .mk.e-sleep::after {
        opacity: 1;
        animation: zz 2.4s ease-in-out infinite;
      }
      .mk.e-error {
        --r1: 0deg;
        --r2: 0deg;
      }
      .mk.e-error i {
        background-color: transparent;
        width: 0.2em;
        height: 0.2em;
        border-radius: 0;
        animation: none;
      }
      .mk.e-error i::before,
      .mk.e-error i::after {
        opacity: 1;
        width: 0.26em;
        height: 0.045em;
        border-radius: 0.03em;
        top: 0.078em;
        left: -0.03em;
        transform-origin: 50% 50%;
      }
      .mk.e-error i::before {
        rotate: 45deg;
      }
      .mk.e-error i::after {
        rotate: -45deg;
      }
      @keyframes blink {
        0%,
        94%,
        100% {
          transform: scaleY(1);
        }
        96% {
          transform: scaleY(0.1);
        }
      }
      @keyframes scan {
        0%,
        100% {
          translate: -0.1em 0;
        }
        50% {
          translate: 0.1em 0;
        }
      }
      @keyframes listen {
        50% {
          scale: 1.22;
        }
      }
      @keyframes look {
        0%,
        4% {
          translate: 0 0;
        }
        14%,
        24% {
          translate: -0.1em 0.01em;
        }
        34%,
        42% {
          translate: 0.1em -0.04em;
        }
        52%,
        58% {
          translate: -0.04em -0.06em;
        }
        66%,
        90% {
          translate: 0.05em 0.02em;
        }
        100% {
          translate: 0 0;
        }
      }
      @keyframes bounce {
        0%,
        100% {
          translate: 0 0.01em;
        }
        50% {
          translate: 0 -0.025em;
        }
      }
      @keyframes pop {
        0%,
        70%,
        100% {
          scale: 1;
        }
        80% {
          scale: 1.15;
        }
        90% {
          scale: 0.95;
        }
      }
      @keyframes think {
        0%,
        100% {
          translate: 0.05em -0.08em;
        }
        45%,
        55% {
          translate: -0.05em -0.07em;
        }
        75% {
          translate: 0.02em -0.1em;
        }
      }
      @keyframes tremble {
        0%,
        100% {
          translate: -0.008em 0;
        }
        50% {
          translate: 0.008em 0;
        }
      }
      @keyframes beat {
        0%,
        60%,
        100% {
          scale: 1;
        }
        15% {
          scale: 1.18;
        }
        30% {
          scale: 0.96;
        }
        45% {
          scale: 1.1;
        }
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 0.95;
        }
      }
      @keyframes zz {
        0%,
        100% {
          translate: 0 0;
          opacity: 0.3;
        }
        50% {
          translate: 0.02em -0.06em;
          opacity: 1;
        }
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border-radius: 999px;
        padding: 8px 16px;
        font: 600 13px var(--font);
        background: var(--chip);
        color: var(--ink);
        white-space: nowrap;
        border: 0;
      }
      .btn.pri {
        background: var(--accent);
        color: var(--on-accent);
        box-shadow: 0 6px 18px -6px var(--glow);
      }
      .btn.soft {
        background: var(--soft);
        color: var(--soft-ink);
      }
      .btn.ghost {
        background: transparent;
        color: var(--muted);
      }
      .btn.out {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--line);
      }
      .btn.danger {
        background: var(--bad-bg);
        color: var(--bad);
      }
      .btn.sm {
        padding: 5px 12px;
        font-size: 12px;
      }
      .btn.lg {
        padding: 12px 22px;
        font-size: 15px;
      }
      .btn svg {
        width: 16px;
        height: 16px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 4px 11px;
        font-size: 12px;
        font-weight: 600;
        background: var(--chip);
        color: var(--ink);
        white-space: nowrap;
      }
      .chip.on {
        background: var(--accent);
        color: var(--on-accent);
      }
      .chip.soft {
        background: var(--soft);
        color: var(--soft-ink);
      }
      .chip svg {
        width: 14px;
        height: 14px;
      }
      .st {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .st::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .st.ok {
        background: var(--ok-bg);
        color: var(--ok);
      }
      .st.warn {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .st.bad {
        background: var(--bad-bg);
        color: var(--bad);
      }
      .st.idle {
        background: var(--chip);
        color: var(--muted);
      }
      .st.live {
        background: var(--soft);
        color: var(--soft-ink);
      }
      .st.live::before {
        background: var(--accent);
        box-shadow: 0 0 6px var(--glow);
      }
      .card {
        background: var(--panel);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 16px 18px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .ell {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--muted);
      }

      /* Computer layout: nav rail, list, main, optional inspector. */
      .d {
        display: grid;
        grid-template-columns: 76px 300px minmax(0, 1fr) 300px;
      }
      .d.nolist {
        grid-template-columns: 76px minmax(0, 1fr) 300px;
      }
      .d.nopanel {
        grid-template-columns: 76px 300px minmax(0, 1fr);
      }
      .d.solo {
        grid-template-columns: 76px minmax(0, 1fr);
      }
      .nav {
        background: var(--side);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 18px 0;
        box-shadow: inset -1px 0 0 var(--line);
      }
      .nav .mk {
        margin-bottom: 14px;
      }
      .nb {
        width: 50px;
        height: 50px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        color: var(--muted);
        position: relative;
      }
      .nb svg {
        width: 22px;
        height: 22px;
      }
      .nb.on {
        background: var(--soft);
        color: var(--accent-ink);
      }
      .nb .n {
        position: absolute;
        top: 6px;
        right: 6px;
        min-width: 16px;
        height: 16px;
        border-radius: 99px;

        font-weight: 700;

        place-items: center;

      }
      .nav .sp {
        flex: 1;
      }
      .hubdot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 0 4px var(--ok-bg);
        margin-bottom: 8px;
      }
      .lst {
        background: var(--side);
        padding: 20px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
        overflow: hidden;
        box-shadow: inset -1px 0 0 var(--line);
      }
      .lh {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 6px;
      }
      .lh h2 {
        font-size: 20px;
        font-weight: 700;
        flex: 1;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--chip);
        border-radius: 999px;
        padding: 9px 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .search svg {
        width: 16px;
        height: 16px;
      }
      .grp {
        padding: 8px 8px 0;
      }
      .ci {
        padding: 10px 12px;

      .ci .tm {

      .mn {

      .hd .sub {

        color: var(--muted);

      .sc {

        display: flex;
        flex-direction: column;
        gap: 16px;

      .pn {
        background: var(--side);

      }
      .msg.me {
        justify-content: flex-end;
      }
      .msg .mk {
        margin-top: 2px;

      .bub {
        background: var(--panel);

        box-shadow: var(--shadow);

      }

      .who {

      .steps {

        padding: 7px 12px;

        color: var(--muted);

        font-weight: 600;
      }
      .steps svg {

        height: 15px;
      }
      .steps .last {
        font-family: var(--mono);
        font-weight: 400;
        font-size: 11.5px;
      }
      .stl {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: -4px 0 10px;
        padding: 8px 12px;
        border-radius: 14px;
        background: var(--chip);
      }
      .stl div {
        display: flex;
        gap: 8px;
        align-items: center;
        font: 400 11.5px/1.5 var(--mono);
        color: var(--ink);
        min-width: 0;
      }
      .stl svg {
        width: 14px;
        height: 14px;
        color: var(--accent-ink);
      }
      .stl .ok {
        color: var(--ok);
      }
      .plus {
        color: var(--ok);
      }
      .minus {
        color: var(--bad);
      }
      .acts {
        display: flex;
        gap: 4px;
        margin-top: 8px;
      }
      .working {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .dots {
        display: flex;
        gap: 4px;
      }
      .dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 6px var(--glow);
        animation: dot 1.3s infinite ease-in-out;
      }
      .dots i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes dot {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.75);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .cmp {
        padding: 10px 28px 22px;
      }
      .box {
        max-width: 760px;
        margin: 0 auto;
        background: var(--panel);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 14px 12px 10px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .box .ph {
        color: var(--muted);
      }
      .send {
        width: 40px;
        height: 40px;
        border-radius: 50%;

        color: var(--eye);

        place-items: center;
        box-shadow:
          0 0 0 2px var(--shell),

        filter: drop-shadow(0 0 0.05em var(--eye)) drop-shadow(0 0 0.14em var(--glow));

        background: var(--ink);

        box-shadow: none;

      .ic {

        height: 34px;
        border-radius: 50%;

        place-items: center;

        background: var(--chip);
        color: var(--ink);
      }
      .ring {
        --p: 38;

        height: 64px;

        place-items: center;

      .task {

        display: block;
        color: var(--muted);
        font-size: 11.5px;

      .task svg {
        color: var(--accent-ink);

      .scrim {
        position: absolute;
        inset: 0;
        background: var(--scrim);

        -webkit-backdrop-filter: blur(3px);
        z-index: 20;
        display: grid;
        place-items: center;
      }
      .dlg {

        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .dlg h2 {
        font-size: 20px;
        font-weight: 700;
        text-wrap: balance;

        right: 0;

        padding: 10px 20px 34px;

        gap: 12px;

        height: 5px;
        border-radius: 9px;
        background: var(--line);
        align-self: center;
        margin-bottom: 4px;
      }
      .sheet h2 {
        font-size: 18px;
        font-weight: 700;
      }
      .sheet,
      .card {
        --ring-bg: var(--panel);

        gap: 12px;
        align-items: center;

        box-shadow: 0 16px 40px -12px oklch(0.1 0.03 var(--h) / 0.5);

      .toast .btn {
        background: var(--accent);
        color: var(--on-accent);
      }
      .banner {
        display: flex;
        gap: 12px;
        align-items: center;
        background: var(--warn-bg);
        color: var(--ink);
        border-radius: 18px;
        padding: 12px 16px;
        font-size: 13px;
      }
      .banner > svg {
        color: var(--warn);
      }
      .codebig {
        font: 500 40px/1 var(--mono);
        letter-spacing: 0.14em;
        text-align: center;
        background: var(--chip);
        border-radius: 18px;
        padding: 16px 10px;
        color: var(--ink);
      }
      .way {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        font-size: 13.5px;
      }
      .way .n {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--soft);
        color: var(--soft-ink);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
      }
      .tl {
        position: relative;
        height: 54px;
        border-radius: 16px;
        background: var(--chip);
        overflow: hidden;
      }
      .tl .hr {
        position: absolute;
        bottom: 4px;
        font-size: 10px;
        color: var(--muted);
        transform: translateX(-50%);
      }
      .tl .ev {
        position: absolute;
        top: 9px;
        height: 22px;
        border-radius: 99px;
        background: var(--soft);
        color: var(--soft-ink);
        font-size: 11px;
        font-weight: 700;
        padding: 2px 9px;
        white-space: nowrap;
      }
      .tl .now {

        bottom: 0;

        background: var(--accent);
        box-shadow: 0 0 8px var(--glow);

      .tog {

        height: 26px;
        border-radius: 99px;
        background: var(--line);
        position: relative;
        flex: none;
      }
      .tog::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--panel);
        box-shadow: 0 1px 3px oklch(0 0 0 / 0.25);
      }
      .tog.on {
        background: var(--accent);
      }
      .tog.on::after {
        left: 19px;
        background: oklch(1 0 0);

      .mini-sw {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .mini-sw i {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.1);
      }
      .mini-sw i.on {
        box-shadow:
          0 0 0 2px var(--panel),
          0 0 0 4px var(--ink);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 12.5px;
        font-weight: 600;
      }
      .input {
        background: var(--chip);
        border-radius: 14px;
        padding: 10px 14px;
        font: 400 13px var(--mono);
        color: var(--muted);

        overflow: hidden;
        background: var(--chip);

      }
      .diff .a {
        background: var(--ok-bg);
      }
      .diff .r {
        background: var(--bad-bg);
      }
      .check {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 12px 0;
        border-top: 1px solid var(--line);

      .check:first-of-type {
        border-top: 0;
      }

        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .check .m svg {
        width: 16px;
        height: 16px;
      }
      .m.ok {
        background: var(--ok-bg);
        color: var(--ok);
      }
      .m.todo {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .m.opt {
        background: var(--chip);
        color: var(--muted);
      }
      .m.bad {
        background: var(--bad-bg);
        color: var(--bad);
      }

        font-size: 13.5px;
      }
      .check small {
        display: block;
        color: var(--muted);
        font-size: 12px;

        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;

        font-weight: 600;

        color: var(--accent-ink);

      .sug .card small {
        display: block;
        color: var(--muted);
        font-weight: 500;
        font-size: 12px;

        border-radius: 18px;

        flex-direction: column;
        gap: 6px;

        box-shadow: var(--shadow);

        font-size: 14px;

      .tags {

        display: flex;
        flex-direction: column;

      .dev {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }
      .dev:first-of-type {
        border-top: 0;
      }
      .dev .ic {

        color: var(--ink);

        height: 40px;

        display: grid;

      .tab {

  <body>

    <script>
      const COLORS = [

        ["Violet", "#8b5cf6"],
        ["Indigo", "#5468ff"],
        ["Graphite", "#6b7a90"],
      ];

      /* sRGB hex to OKLCH, so one picked colour gives the hue, chroma and lightness of the whole palette. */
      function hexToOklch(hex) {
        const n = parseInt(hex.slice(1), 16);
        const lin = (v) => {
          v /= 255;
          return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        };
        const r = lin((n >> 16) & 255),
          g = lin((n >> 8) & 255),
          b = lin(n & 255);
        const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
        const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
        const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
        const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s;
        const A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s;
        const B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
        let H = (Math.atan2(B, A) * 180) / Math.PI;
        if (H < 0) H += 360;
        return { L, C: Math.hypot(A, B), H };
      }

      const P = {
        chat: '<path d="M20.5 12a8 8 0 0 1-11.7 7.1L4 20l1-4.4A8 8 0 1 1 20.5 12z"/>',

        briefcase:

          '<path d="M12 18a2.25 2.25 0 0 1 2.25-2.25h4.33a2.25 2.25 0 0 0 2.19-1.75A9.05 9.05 0 0 0 21 11.92c-.04-4.95-4.14-8.97-9.09-8.92a9 9 0 0 0-8.91 9c0 3.92 2.51 6.89 6 8.12A2.25 2.25 0 0 0 12 18z"/><circle cx="12" cy="7.13" r="1.1" fill="currentColor" stroke="none"/><circle cx="7.88" cy="9.38" r="1.1" fill="currentColor" stroke="none"/><circle cx="7.88" cy="14.63" r="1.1" fill="currentColor" stroke="none"/><circle cx="16.13" cy="9.38" r="1.1" fill="currentColor" stroke="none"/>',

        return `<div class="eve d ${cls}">${nav(on, badge)}${list}<section class="mn">${main}</section>${panel ? `<aside class="pn">${panel}</aside>` : ""}${overlay}</div>`;

        `<nav class="tab">${[

      const phone = ({ on = "chats", head = "", body, foot = "", overlay = "", tab = true, badge = 1 }) =>
        `<div class="eve p"><div class="sbar"><span>9:41</span><span class="r">${I("wifi")}${I("batt")}</span></div>
   <section class="mn">${head}${body}${foot}</section>${tab ? tabs(on, badge) : ""}${overlay}</div>`;

      const chatList = (active = 0, approval = true) => {
        const items = [
          [
            "Plan for the week",
            "Eva: You have four things this week…",
            "09:14",
            '<span class="st live">Working</span>',
          ],
          [
            "Ship the new login",

            approval ? '<span class="st warn">Needs you</span>' : "",
          ],
          ["Summary of yesterday's notes", "Done. 12 new notes in the vault.", "08:02", ""],
        ];

      const store = {
        get(k) {
          try {
            return localStorage.getItem(k);

            return null;
          }

            localStorage.setItem(k, v);
          } catch {}
        },
      };

      ).join("");

      function applySeed(hex, name) {
        seed = hex;
        const { L, C, H } = hexToOklch(hex);
        const root = document.documentElement.style;
        root.setProperty("--h", H.toFixed(1));
        root.setProperty("--c", Math.min(C, 0.2).toFixed(3));
        root.setProperty("--l", Math.min(Math.max(L, 0.45), 0.9).toFixed(3));
        root.setProperty("--on-l", L > 0.72 ? "0.2" : "1");
        const known = COLORS.find(([, x]) => x.toLowerCase() === hex.toLowerCase());
        document.getElementById("cname").textContent = name || (known ? known[0] : hex.toUpperCase());
        document.querySelectorAll("[data-seed]").forEach((el) => {
          const on = el.dataset.seed.toLowerCase() === hex.toLowerCase();
          if (el.tagName === "BUTTON") el.setAttribute("aria-pressed", String(on));
          else el.classList.toggle("on", on);
        });
        document.getElementById("customColor").value = hex;
        store.set("eve-seed", hex);
      }
      function applyMode(m) {
        mode = m;
        document.querySelectorAll(".eve").forEach((el) => (el.dataset.mode = m));
        document
          .querySelectorAll("#modes button")
          .forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
        store.set("eve-mode", m);
      }
      document.addEventListener("click", (e) => {
        const s = e.target.closest("[data-seed]");
        if (s) applySeed(s.dataset.seed, s.dataset.name);
        const m = e.target.closest("#modes button");
        if (m) applyMode(m.dataset.mode);
      });
      document.getElementById("customColor").addEventListener("input", (e) => applySeed(e.target.value));

      function fitAll() {
        document.querySelectorAll(".fit").forEach((el) => {
          const w = +el.dataset.w,
            h = +el.dataset.h;
          const s = Math.min(1, el.clientWidth / w);
          el.firstElementChild.style.transform = `scale(${s})`;
          el.style.height = h * s + "px";
        });
      }
      const ro = new ResizeObserver(fitAll);
      document.querySelectorAll(".pair").forEach((p) => ro.observe(p));
      window.addEventListener("resize", fitAll);
      if (document.fonts) document.fonts.ready.then(fitAll);

      const CYCLE = [
        ["e-scan", 5000],
        ["e-think", 3000],
        ["e-joy", 2200],
        ["e-wink", 2200],
        ["e-surprise", 2600],
        ["e-listen", 2400],
        ["e-love", 2200],
      ];
      const ALL = FACES.map((x) => x[0]);
      const setFace = (el, face) => {
        ALL.forEach((c) => el.classList.remove(c));
        el.classList.add(face);
      };
      let step = 0;
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const next = () => {
          step = (step + 1) % CYCLE.length;
          document.querySelectorAll(".mk.cycle").forEach((el) => setFace(el, CYCLE[step][0]));
          setTimeout(next, CYCLE[step][1]);
        };
        setTimeout(next, CYCLE[0][1]);
      }
      document.addEventListener("click", (e) => {
        const card = e.target.closest("[data-face]");
        if (!card) return;
        const el = card.querySelector(".mk");
        const cur = ALL.find((c) => el.classList.contains(c)) || card.dataset.face;
        setFace(el, ALL[(ALL.indexOf(cur) + 1) % ALL.length]);
      });

      applySeed(seed);
      applyMode(mode);
      fitAll();
