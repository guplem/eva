# Git hooks. `bun install` installs them (the `prepare` script).
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,js,cjs,json,md,yml,yaml}"
      run: bunx prettier --check {staged_files}
    lint:
      glob: "*.{ts,js}"
      run: bunx eslint --no-warn-ignored {staged_files}
    # Claude Code reads AGENTS.md only when no CLAUDE.md exists in the folder or above it.
    no-claude-md:
      glob: ["CLAUDE.md", "**/CLAUDE.md"]
      # The staged files include deleted ones: a delete is allowed. Single quotes only: on Windows,
      # Lefthook wraps the whole command in double quotes.
      run: for file in {staged_files}; do if test -e $file; then echo 'Do not commit a CLAUDE.md. Write the rules in AGENTS.md.' >&2; exit 1; fi; done

# The fast checks, and the private denylist that only exists locally. CI runs the tests.
pre-push:
  commands:
    check:
      run: bun run check:static

# After a pull or a branch switch: install changed dependencies, and copy the skills for Claude Code.
post-merge:
  files: git diff --name-only ORIG_HEAD HEAD
  commands: &after-update
    install:
      glob: "bun.lock"
      run: bun install
    skills:
      run: bun run scripts/sync-skills.ts

post-checkout:
  files: git diff --name-only {1} {2}
  commands: *after-update
