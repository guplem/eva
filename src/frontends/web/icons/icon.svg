<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- EVE's visor, as the .mk rule of visor.css draws it in EVE blue, with no shell ring. -->
  <defs>
    <radialGradient id="visor" cx="50%" cy="22%" r="72%" fx="50%" fy="22%">
      <stop offset="0" stop-color="#1c252d" />
      <stop offset="1" stop-color="#000102" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-80%" width="200%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#87ddff" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3ab3ff" />
    </filter>
  </defs>
  <g transform="translate(2 6.8) scale(0.96)">
    <path d="M50 0A50 49.5 0 0 1 100 49.5A46 40.5 0 0 1 54 90H46A46 40.5 0 0 1 0 49.5A50 49.5 0 0 1 50 0z" fill="url(#visor)" />
    <g fill="#87ddff" filter="url(#glow)">
      <ellipse cx="29" cy="45" rx="13" ry="8" transform="rotate(14 29 45)" />
      <ellipse cx="71" cy="45" rx="13" ry="8" transform="rotate(-14 71 45)" />
    </g>
  </g>
</svg>
